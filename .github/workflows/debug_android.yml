name: Android Debug Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    # 允许手动触发构建

jobs:
  android-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: 代码迁出
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 构建Java环境
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: 安装Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      # 用项目自带的 patch.ps1 正确打 Flutter SDK / material_ui / cupertino_ui 补丁
      # （原 workflow 内联的 "git revert 362b1de" 在 Flutter 3.47.2 上冲突留下 <<<===>>> 标记，
      #  且内联的三个 git apply 文件名写错，导致 Flutter 私有 API 未暴露而编译失败。
      #  patch.ps1 才是作者设计的正确流程。）
      - name: apply PiliNara patches
        shell: pwsh
        run: lib/scripts/patch.ps1 android

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1 android

      - name: Flutter Build Debug APK
        run: |
          flutter build apk --debug --dart-define-from-file=pili_release.json --pub --target-platform android-arm64
       
      - name: Rename Debug APKa
        run: |
          mkdir -p output
          if [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            mv "build/app/outputs/flutter-apk/app-debug.apk" "output/PiliNara_android_debug_arm64.apk"
          fi
        shell: bash

      - name: 上传 Debug 产物
        uses: actions/upload-artifact@v4
        with:
          name: Android_Debug_APK_arm64
          path: output/PiliNara_android_debug_arm64.apk
