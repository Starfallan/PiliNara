# PiliNara-miuix 的固定签名 key。
#
# 之前 CI 每次都在新的 runner 上跑，Flutter 会重新生成 debug.keystore，导致每个 release 的签名
# 都不一样，新版本无法覆盖安装（会提示「应用未安装」）。这里把仓库自带的一个调试级密钥固定下来，
# gradle（android/app/build.gradle.kts 的 signingConfigs.release）读到它就用它签名，于是所有版本
# 签名一致、可以直接覆盖安装。
#
# 这是公开的调试级密钥（口令也一并写在这里），只用于这个自用分支，不要用它签任何需要保密的产物。
storeFile=pilinara-miuix.jks
storePassword=android
keyAlias=pilinara-miuix
keyPassword=android
